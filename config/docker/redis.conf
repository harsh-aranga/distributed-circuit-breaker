# Redis Configuration for Distributed Circuit Breaker
# Optimized for coordination, pub/sub, and Lua script execution

# ============================================
# NETWORK
# ============================================
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
tcp-keepalive 300
timeout 0

# ============================================
# PERSISTENCE (Mandatory for production-grade demo)
# ============================================

# RDB Snapshots - save if at least 1 key changed in 60 seconds
save 60 1
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append Only File) - better durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ============================================
# MEMORY MANAGEMENT
# ============================================

# Limit Redis memory to 512MB (reasonable for demo)
maxmemory 512mb

# Eviction policy - LRU for circuit breaker use case
# Circuit state is critical, but old metrics can be evicted
maxmemory-policy allkeys-lru

# Samples for LRU/LFU algorithms
maxmemory-samples 5

# ============================================
# LUA SCRIPTING (Critical for atomic operations)
# ============================================

# Kill Lua scripts after 5 seconds (safety for long-running scripts)
lua-time-limit 5000

# ============================================
# SLOW LOG (Debugging)
# ============================================

# Log commands taking longer than 10ms
slowlog-log-slower-than 10000
slowlog-max-len 128

# ============================================
# LOGGING
# ============================================

loglevel notice
logfile ""

# ============================================
# SECURITY
# ============================================

# Password set via command line (--requirepass) in docker-compose
# protected-mode ensures only localhost/Docker network can connect

# ============================================
# CLIENTS
# ============================================

# Maximum number of connected clients
maxclients 10000

# ============================================
# PUB/SUB (Critical for event distribution)
# ============================================

# No special config needed - pub/sub works out of box
# Timeout 0 ensures connections stay alive for event listening

# ============================================
# ADVANCED CONFIG
# ============================================

# Disable RDB if persistence not needed (we need it)
# save ""

# Lazy freeing (better performance)
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# Active defragmentation (disabled for simplicity)
# activedefrag no

# ============================================
# NOTES FOR PRODUCTION
# ============================================

# For production HA:
# - Use Redis Sentinel (master-replica with auto-failover)
# - Use Redis Cluster (sharding + HA)
# - Increase maxmemory based on circuit count and instance count
# - Enable TLS for encrypted communication
# - Use ACLs for fine-grained access control
# - Monitor with Prometheus exporter

# Memory calculation for production:
# Per circuit: ~10KB (state + metrics + probe tracking)
# Per instance per circuit: ~2KB (instance-specific counters)
# Example: 100 circuits × 30 instances = ~3MB + overhead
# Recommended: 128MB minimum, 512MB-1GB for safety

# Circuit breaker data structures:
# - String keys for state (CLOSED/OPEN/HALF_OPEN)
# - String keys for bucketed counters (6 buckets × 10 seconds)
# - String keys for probe coordination
# - Pub/sub channel for event distribution
# - Keys expire naturally via TTL (sliding window)